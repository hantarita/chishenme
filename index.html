<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>吃什么 · 校园食堂点评推荐</title>
<meta name="description" content="以北大家园食堂二层为例的校园食堂点评推荐工具，帮学生发现新菜、避开踩雷窗口。">
<style>
  :root { --ink:#241f1c; --muted:#6f6660; --line:#e6dfd8; --bg:#faf7f3; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.6;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:40px 16px 56px; }
  h1 { font-size:40px; line-height:1.2; margin:0 0 8px; }
  h2 { font-size:20px; margin:0 0 12px; }
  .lead { font-size:18px; color:var(--muted); margin:0 0 16px; }
  .status { display:inline-block; padding:4px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); font-size:14px; }
  section { margin-top:36px; }
  .plan { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; background:#d9d2ca; padding:12px; border-radius:12px; }
  .stall { min-height:84px; padding:8px; border-radius:8px; display:flex; flex-direction:column; justify-content:space-between; font-weight:600; font-size:14px; }
  .stall small { font-weight:400; font-size:13px; }
  .hall { grid-column:2 / 6; grid-row:2 / 5; display:flex; align-items:center; justify-content:center; color:var(--muted); border:1px dashed #a79e95; border-radius:8px; }
  .legend { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; color:var(--muted); }
  .bar { flex:0 1 220px; height:10px; border:1px solid var(--line); border-radius:999px;
    background:linear-gradient(90deg,#fff 0%,#fdbb84 50%,#ef4a32 80%,#b30000 100%); }
  ul { margin:0; padding-left:20px; }
  footer { margin-top:36px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
  @media (max-width:640px) {
    h1 { font-size:32px; }
    .plan { grid-template-columns:repeat(3,1fr); }
    .hall { display:none; }
  }
</style>
</head>
<body>
<main>
  <h1>吃什么</h1>
  <p class="lead">校园食堂点评推荐：发现新菜，避开踩雷窗口。以北大家园食堂二层为例。</p>
  <span class="status">完整版搭建中，当前为产品预览</span>

  <section>
    <h2>食堂热力图预览</h2>
    <div class="plan" id="plan"><div class="hall">中央餐桌区 · 完整版为可交互的 3D 空间</div></div>
    <div class="legend">0 分 <span class="bar"></span> 5 分</div>
  </section>

  <section>
    <h2>规划中的功能</h2>
    <ul>
      <li>3D 食堂空间：每个档口都有招牌，颜色随评分从白色变为深红</li>
      <li>档口详情：综合评分、推荐菜和避雷菜榜单，以及学生点评</li>
      <li>右侧栏：菜品上新和综合榜前五，每道菜标注辣或不辣</li>
      <li>转盘：不知道吃什么时，从不同档口随机抽菜</li>
    </ul>
  </section>

  <footer>档口、菜品和评分均为演示数据，布局为示意，并非家园食堂的真实情况。</footer>
</main>
<script>
  // 布局顺序：后墙 6 个，左右墙各 3 个
  var stalls = [
    ["北京味道",4.8],["川渝小馆",4.6],["兰州牛肉面",4.4],["湘味小炒",4.1],["粤式烧腊",3.8],["淮扬小笼",3.5],
    ["东北饺子馆",3.2],["云南过桥米线",2.9],["山西刀削面",2.6],["新疆风味",2.2],["西北面食",1.7],["闽南沙茶面",0]
  ];
  var stops = [[0,[255,255,255]],[2.5,[253,187,132]],[4,[239,74,50]],[5,[179,0,0]]];
  function heat(s) {
    for (var i = 1; i < stops.length; i++) if (s <= stops[i][0]) {
      var a = stops[i-1], b = stops[i], t = (s-a[0])/(b[0]-a[0]);
      return a[1].map(function (v,k) { return Math.round(v+(b[1][k]-v)*t); });
    }
    return stops[stops.length-1][1];
  }
  var plan = document.getElementById("plan"), hall = plan.firstElementChild;
  var cells = [[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[1,2],[1,3],[1,4],[6,2],[6,3],[6,4]];
  var mobile = matchMedia("(max-width:640px)").matches;
  stalls.forEach(function (s, i) {
    var c = heat(s[1]), d = document.createElement("div"), dark = c[0]*.299+c[1]*.587+c[2]*.114 < 140;
    d.className = "stall";
    d.style.background = "rgb("+c+")";
    d.style.color = dark ? "#fff" : "#241f1c";
    if (!mobile) { d.style.gridColumn = cells[i][0]; d.style.gridRow = cells[i][1]; }
    d.innerHTML = "<span>"+s[0]+"</span><small>"+(s[1] ? "★ "+s[1].toFixed(1) : "暂无评分")+"</small>";
    plan.insertBefore(d, hall);
  });
</script>
</body>
</html>
